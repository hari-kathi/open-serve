# Catalog preset: gpt-oss-20b (chat, tool calling, reasoning)
#
# OpenAI gpt-oss-20b — open-weights MoE reasoning model (21B total / ~3.6B
# active parameters). License: Apache-2.0. Context length: 131,072 tokens.
#
# Ships with native MXFP4 quantization on the MoE weights (~13 GB on disk).
# Do NOT set dtype: bfloat16 — forcing bf16 dequantizes the experts and
# roughly quadruples weight memory. vLLM auto-detects the MXFP4 checkpoint.
#
# GPU sizing (indicative — validate for your accelerator/quota):
#   accelerator   gpus  tp  max_model_len  notes
#   H100-80GB     1     1   131072         native MXFP4 kernel path
#   A100-80GB     1     1   131072         MXFP4 via fallback (Marlin/Triton) kernels
#
# Merge under `serveModels:` in your environment values, then set enabled: true.
gpt-oss-20b:
  enabled: false
  modelId: "openai/gpt-oss-20b"
  tier: production
  runner: chat
  category: LLM
  description: "OpenAI gpt-oss-20b open-weights MoE reasoning model (MXFP4)"
  type: vllm
  rayVersion: "2.55.1"
  image:
    repository: "hari-kathi/open-serve-vllm"
    tag: "0.2.0"
  routePrefix: "/"
  sharedMemorySize: "16Gi"
  vllmArgs:
    model: "openai/gpt-oss-20b"
    served_model_name: "openai/gpt-oss-20b"
    # model_source options:
    #   - leave `model` above as the HF id to pull from the Hub
    #   - model_source: "gs://<your-model-bucket>/models/openai/gpt-oss-20b"
    #   - model_source: "s3://<your-model-bucket>/models/openai/gpt-oss-20b"
    tensor_parallel_size: 1
    # No dtype override — checkpoint ships MXFP4 (see header).
    max_model_len: 131072
    max_num_seqs: 32
    gpu_memory_utilization: 0.90
    # gpt-oss uses the harmony response format; the `openai` tool parser
    # handles its function-calling channel. Reasoning content is emitted
    # natively — no reasoning_parser flag required.
    enable_auto_tool_choice: true
    tool_call_parser: "openai"
  replicas: { min: 0, max: 1 }
  autoscaling:
    targetOngoingRequests: 5
    downscaleDelayS: 600
    upscaleDelayS: 60
  gpu:
    count: 1
    acceleratorType: "A100"
  resources:
    worker:
      requests: { cpu: "8", memory: "32Gi" }
      limits: { cpu: "8", memory: "48Gi" }
