# Catalog preset: llama-3-1-8b-instruct (chat, tool calling)
#
# Meta Llama 3.1 8B Instruct — general-purpose instruction-tuned chat model.
# License: Llama 3.1 Community License (not OSI open source; review the
# acceptable-use policy). Context length: 131,072 tokens (sized to 32,768
# below). The HF repo is GATED — accept the license on Hugging Face and
# provide an HF token via env (see the commented env block below), or
# pre-stage weights in your own bucket via model_source.
#
# GPU sizing (indicative — validate for your accelerator/quota):
#   accelerator   gpus  tp  max_model_len  notes
#   A100-40GB     1     1   32768          default below
#   L4-24GB       1     1   8192           reduce max_model_len + max_num_seqs
#
# Merge under `serveModels:` in your environment values, then set enabled: true.
llama-3-1-8b-instruct:
  enabled: false
  modelId: "meta-llama/Llama-3.1-8B-Instruct"
  tier: production
  runner: chat
  category: LLM
  description: "Meta Llama 3.1 8B Instruct general-purpose chat model"
  type: vllm
  rayVersion: "2.55.1"
  routePrefix: "/"
  sharedMemorySize: "16Gi"
  vllmArgs:
    model: "meta-llama/Llama-3.1-8B-Instruct"
    served_model_name: "meta-llama/Llama-3.1-8B-Instruct"
    # model_source options:
    #   - leave `model` above as the HF id to pull from the Hub (HF token
    #     required — gated repo)
    #   - model_source: "gs://<your-model-bucket>/models/meta-llama/Llama-3.1-8B-Instruct"
    #   - model_source: "s3://<your-model-bucket>/models/meta-llama/Llama-3.1-8B-Instruct"
    tensor_parallel_size: 1
    dtype: "bfloat16"
    max_model_len: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.90
    enable_auto_tool_choice: true
    tool_call_parser: "llama3_json"
  # Required for pulling gated weights from the Hub (skip when using
  # model_source with pre-staged weights):
  # env:
  #   - name: HF_TOKEN
  #     valueFrom:
  #       secretKeyRef: { name: hf-token, key: token }
  replicas: { min: 0, max: 1 }
  autoscaling:
    targetOngoingRequests: 5
    downscaleDelayS: 600
    upscaleDelayS: 60
  gpu:
    count: 1
    acceleratorType: "A100"
  resources:
    worker:
      requests: { cpu: "8", memory: "32Gi" }
      limits: { cpu: "8", memory: "48Gi" }
