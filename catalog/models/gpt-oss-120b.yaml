# Catalog preset: gpt-oss-120b (chat, tool calling, reasoning)
#
# OpenAI gpt-oss-120b — open-weights MoE reasoning model (117B total / ~5.1B
# active parameters). License: Apache-2.0. Context length: 131,072 tokens.
#
# Ships with native MXFP4 quantization on the MoE weights (~60 GB on disk),
# which is what lets it fit a single H100-80GB. Do NOT set dtype: bfloat16 —
# forcing bf16 dequantizes the experts and the model no longer fits these
# footprints. vLLM auto-detects the MXFP4 checkpoint.
#
# GPU sizing (indicative — validate for your accelerator/quota):
#   accelerator   gpus  tp  max_model_len  notes
#   A100-80GB     2     2   131072         MXFP4 via fallback kernels (default below)
#   H100-80GB     1     1   131072         native MXFP4; set tensor_parallel_size: 1,
#                                          gpu.count: 1
#
# Merge under `serveModels:` in your environment values, then set enabled: true.
gpt-oss-120b:
  enabled: false
  modelId: "openai/gpt-oss-120b"
  tier: production
  runner: chat
  category: LLM
  description: "OpenAI gpt-oss-120b open-weights MoE reasoning model (MXFP4)"
  type: vllm-raw
  rayVersion: "2.55.1"
  image:
    repository: "hari-kathi/open-serve-vllm"
    tag: "0.1.0"
  routePrefix: "/"
  sharedMemorySize: "32Gi"
  vllmArgs:
    model: "openai/gpt-oss-120b"
    served_model_name: "openai/gpt-oss-120b"
    # model_source options:
    #   - leave `model` above as the HF id to pull from the Hub
    #   - model_source: "gs://<your-model-bucket>/models/openai/gpt-oss-120b"
    #   - model_source: "s3://<your-model-bucket>/models/openai/gpt-oss-120b"
    tensor_parallel_size: 2
    # No dtype override — checkpoint ships MXFP4 (see header).
    max_model_len: 131072
    max_num_seqs: 32
    gpu_memory_utilization: 0.90
    # harmony format: `openai` tool parser handles function calling;
    # reasoning content is emitted natively — no reasoning_parser flag.
    enable_auto_tool_choice: true
    tool_call_parser: "openai"
  replicas: { min: 0, max: 1 }
  autoscaling:
    targetOngoingRequests: 5
    downscaleDelayS: 600
    upscaleDelayS: 60
  gpu:
    count: 2
    acceleratorType: "A100"
  resources:
    worker:
      requests: { cpu: "16", memory: "96Gi" }
      limits: { cpu: "16", memory: "128Gi" }
