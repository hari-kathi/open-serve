# Catalog preset: Qwen3-8B (chat, tool calling)
# Merge under `serveModels:` in your environment values, then set enabled: true.
# GPU sizing notes:
#   - 1x A100 40GB or 1x L4-class GPU with reduced max_model_len
qwen3-8b:
  enabled: false
  modelId: "Qwen/Qwen3-8B"
  tier: production
  runner: chat
  category: LLM
  type: vllm-raw
  routePrefix: "/"
  sharedMemorySize: "20Gi"
  vllmArgs:
    model: "Qwen/Qwen3-8B"
    served_model_name: "Qwen/Qwen3-8B"
    # Point at your model store (hf://, gs://, s3://) or leave as the HF id to pull from the Hub.
    tensor_parallel_size: 1
    dtype: "bfloat16"
    max_model_len: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.90
    enable_auto_tool_choice: true
    tool_call_parser: "hermes"
  replicas: { min: 0, max: 1 }
  autoscaling:
    targetOngoingRequests: 5
    downscaleDelayS: 600
    upscaleDelayS: 60
  gpu:
    count: 1
    acceleratorType: "A100"
  resources:
    worker:
      requests: { cpu: "8", memory: "32Gi" }
      limits: { cpu: "8", memory: "48Gi" }
