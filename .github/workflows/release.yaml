name: release

# Tag-driven release: push a `v*` tag (e.g. v0.2.0) to publish service
# images, runtime images, and the Helm chart to GHCR, then cut a GitHub
# Release. VERSION is the tag with the leading `v` stripped.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  images:
    name: image ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: services/gateway
          - name: probe
            context: services/probe
          - name: status
            context: services/status
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local docker daemon first so Trivy can scan the
      # image before anything is pushed to the registry.
      - name: Build (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ghcr.io/hari-kathi/open-serve-${{ matrix.name }}:${{ env.VERSION }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ghcr.io/hari-kathi/open-serve-${{ matrix.name }}:${{ env.VERSION }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/hari-kathi/open-serve-${{ matrix.name }}:${{ env.VERSION }}
            ghcr.io/hari-kathi/open-serve-${{ matrix.name }}:latest

  # Runtime images are multi-GB (CUDA base + vLLM/Ray wheels), so they get
  # their own job: a disk-reclaim step to survive the ~14 GB free on hosted
  # runners, and no Trivy scan (scanning a multi-GB CUDA image routinely
  # exhausts runner disk/time). If runner disk becomes a problem even with
  # the reclaim step, move this job to a manual `workflow_dispatch` workflow
  # and publish runtime images out-of-band from tagging.
  runtime-images:
    name: runtime image ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vllm
            context: runtimes/vllm
          - name: ray-serve-llm
            context: runtimes/ray-serve-llm
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/hostedtoolcache \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/share/swift \
                      /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/hari-kathi/open-serve-${{ matrix.name }}:${{ env.VERSION }}
            ghcr.io/hari-kathi/open-serve-${{ matrix.name }}:latest

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    needs: [images, runtime-images]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v4

      - name: Set chart version/appVersion to release version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/open-serve/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/open-serve/Chart.yaml
          grep -E '^(version|appVersion):' charts/open-serve/Chart.yaml

      - name: Package and push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/open-serve --destination dist/
          helm push "dist/open-serve-${VERSION}.tgz" oci://ghcr.io/hari-kathi/charts

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [chart]
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
