name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  naming-lint:
    name: forbidden-strings lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on internal identifiers
        run: |
          set -e
          # The project was extracted from an internal codebase; these strings must never appear.
          PATTERNS='pryon|ml-serving|mlserving|us-docker\.pkg\.dev|bitbucket'
          MATCHES=$(grep -rIiEn "$PATTERNS" . \
            --exclude-dir=.git --exclude-dir=.github || true)
          if [ -n "$MATCHES" ]; then
            echo "Forbidden internal identifiers found:"
            echo "$MATCHES"
            exit 1
          fi

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly (the wrapper action has opaque
      # failure modes around license checks and push-event commit ranges).
      - name: Install gitleaks
        run: |
          VER=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${VER#v}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan full git history
        run: ./gitleaks detect --source . --redact -v

  python-tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, probe, status]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff
      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check .
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests yet"; fi

  vllm-runtime-tests:
    name: vllm runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r runtimes/vllm/requirements-dev.txt ruff
      - run: ruff check runtimes/vllm
      - run: pytest -q runtimes/vllm/tests

  helm:
    name: helm lint + catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/open-serve
      - run: helm template smoke charts/open-serve > /dev/null
      - name: Values schema rejects invalid input
        run: |
          if helm template smoke charts/open-serve --set serveModels.x.type=bogus > /dev/null 2>&1; then
            echo "values.schema.json failed to reject an invalid runner type"; exit 1
          fi
      - name: Validate catalog presets
        run: scripts/validate-catalog.sh

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'mkdocs-material~=9.0'
      - run: mkdocs build --strict
