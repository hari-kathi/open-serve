{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-serve-gateway-config
  labels:
    {{- include "open-serve.labels" . | nindent 4 }}
    app: open-serve-gateway
    app.kubernetes.io/component: gateway
data:
  # Unauthenticated path-prefix routes (prefix -> URL). When the status page
  # is enabled, "/status" and "/static/" default to the status service;
  # entries set in gateway.publicRoutes always win.
  public-routes.json: |
    {{- $publicRoutes := dict }}
    {{- if .Values.statusPage.enabled }}
    {{- $_ := set $publicRoutes "/status" "http://open-serve-status:8000" }}
    {{- $_ := set $publicRoutes "/static/" "http://open-serve-status:8000" }}
    {{- end }}
    {{- range $prefix, $backend := .Values.gateway.publicRoutes }}
    {{- $_ := set $publicRoutes $prefix (printf "http://%s:%s" $backend.service (toString ($backend.port | default 8000))) }}
    {{- end }}
    {{ $publicRoutes | toJson }}
  {{- if .Values.gateway.modelRoutes }}
  model-routes.json: |
    {{- $modelRoutes := dict }}
    {{- range $model, $backend := .Values.gateway.modelRoutes }}
    {{- $_ := set $modelRoutes $model (printf "http://%s:%s" $backend.service (toString ($backend.port | default 8000))) }}
    {{- end }}
    {{ $modelRoutes | toJson }}
  {{- end }}
  model-tier-map.json: |
    {{- $tierMap := dict }}
    {{- range $name, $model := .Values.serveModels }}
    {{- if $model.enabled }}
    {{- $tier := $model.tier | default "internal-test" }}
    {{- $_ := set $tierMap $name $tier }}
    {{- if $model.modelId }}
    {{- $_ := set $tierMap $model.modelId $tier }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{ $tierMap | toJson }}
{{- end }}
