{{- if .Values.statusPage.enabled }}
{{- /*
  Per-model display metadata for the status page (category + description).
  Auto-generated from serveModels — operators add category/description to
  each model entry to surface it on the page. Models without a category
  default to "Model" inside the service.
*/ -}}
{{- $metadata := dict -}}
{{- range $name, $model := .Values.serveModels -}}
  {{- if and $model.enabled (eq ($model.tier | default "internal-test") "production") -}}
    {{- $entry := dict -}}
    {{- $_ := set $entry "category" ($model.category | default "Model") -}}
    {{- if $model.description -}}
      {{- $_ := set $entry "description" $model.description -}}
    {{- end -}}
    {{- $modelId := $model.modelId | default $name -}}
    {{- $_ := set $metadata $modelId $entry -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-serve-status-config
  labels:
    {{- include "open-serve.labels" . | nindent 4 }}
    app: open-serve-status
    app.kubernetes.io/component: status
data:
  model-metadata.json: {{ $metadata | toJson | quote }}
  slo-config.json: {{ (.Values.monitoring.alerts.probes.slo.perModel | default dict) | toJson | quote }}
  category-order.json: {{ (.Values.statusPage.categoryOrder | default (list "LLM" "Vision-Language" "Embedding" "Reranker" "OCR" "Audio" "Model" "Other")) | toJson | quote }}
{{- end }}
