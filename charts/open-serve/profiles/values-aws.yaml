# open-serve values profile for AWS (EKS + IRSA), matching the reference
# infrastructure in terraform/aws/ and examples/aws-quickstart/.
#
# Minimal start: gateway on, monitoring/probe/status page off (enable
# monitoring once kube-prometheus-stack CRDs exist on the cluster).
#
#   helm install open-serve oci://ghcr.io/hari-kathi/charts/open-serve \
#     -n open-serve -f charts/open-serve/profiles/values-aws.yaml

# The chart requires this ServiceAccount to pre-exist in the release
# namespace (it does not create it). Create it and annotate it with the
# worker IAM role from the Terraform outputs so IRSA hands serving pods
# S3 read access to model weights:
#
#   kubectl -n open-serve create serviceaccount open-serve-worker
#   kubectl -n open-serve annotate serviceaccount open-serve-worker \
#     eks.amazonaws.com/role-arn=<worker_role_arn output>
serviceAccount:
  name: "open-serve-worker"

monitoring:
  enabled: false

probe:
  enabled: false

statusPage:
  enabled: false

externalGateway:
  enabled: false

gateway:
  enabled: true
  image:
    registry: ghcr.io
    repository: hari-kathi/open-serve-gateway
    tag: ""   # empty = chart appVersion
  # Create the API-key Secret before install (see docs/operations/api-keys.md):
  #   kubectl -n open-serve create secret generic open-serve-api-keys \
  #     --from-literal=key-map.json='{"sk-team1-<hex>": "team1"}'
  apiKeySecret:
    name: "open-serve-api-keys"
    key: "key-map.json"
  # Route by the request body's `model` field to the matching RayService.
  modelRoutes:
    Qwen/Qwen3-8B:
      service: "rayservice-qwen3-8b-serve-svc"
      port: 8000

# Example model sized for the quickstart's gpu-l4-1x pool (g6.xlarge:
# 1x NVIDIA L4 24GB, 4 vCPU, 16GiB RAM). Adapted from
# catalog/models/qwen3-8b.yaml — the L4 needs a reduced context window and
# batch size vs the A100 default. Qwen3-8B bf16 weights (~16GB) stream
# through the GPU, not node RAM, but g6.xlarge's 16GiB RAM is still tight:
# the worker requests below leave headroom for kubelet + system daemons.
# If you need more CPU/RAM slack (bigger max_num_seqs, larger shm), use
# g6.2xlarge (8 vCPU / 32GiB) and raise the worker resources accordingly.
serveModels: {}
