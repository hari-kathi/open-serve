  #   routePrefix: "/"
  #   sharedMemorySize: "4Gi"
  #   vllmArgs:
  #     model: "Qwen/Qwen3-8B"
  #     served_model_name: "Qwen/Qwen3-8B"
  #     # Pre-staged weights in your model bucket (read via IRSA), e.g.
  #     # model_source: "s3://<your-model-bucket>/models/Qwen/Qwen3-8B"
  #     tensor_parallel_size: 1
  #     dtype: "bfloat16"
  #     max_model_len: 8192        # L4 24GB; 32768 needs a 40GB+ GPU
  #     max_num_seqs: 16
