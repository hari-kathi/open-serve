# Prometheus Operator CRDs (PodMonitor, ServiceMonitor, PrometheusRule, ...)
# installed separately from kube-prometheus-stack so CRD lifecycle is
# decoupled from the monitoring stack itself.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: open-serve
spec:
  chart:
    spec:
      chart: prometheus-operator-crds
      # Pin an exact version once validated in your environment.
      version: ">=16.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: open-serve
  interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
