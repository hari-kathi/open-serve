apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: open-serve
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pin an exact version once validated in your environment.
      version: ">=65.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-monitoring
        namespace: open-serve
  interval: 10m
  install:
    # CRDs are managed by the prometheus-operator-crds HelmRelease.
    crds: Skip
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    disableWait: true
    remediation:
      retries: 3
