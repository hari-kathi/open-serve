# Upstream prometheus-community Helm chart repository (monitoring copy —
# each component directory is applied by its own Flux Kustomization, so the
# HelmRepository is declared per component; names must not collide).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community-monitoring
  namespace: open-serve
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
