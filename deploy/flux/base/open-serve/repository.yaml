# The open-serve Helm chart, published as an OCI artifact.
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: open-serve
  namespace: open-serve
spec:
  # Uncomment for registries that use ambient cloud credentials, e.g. GCP
  # Artifact Registry with Workload Identity:
  # provider: gcp
  interval: 5m0s
  url: oci://ghcr.io/hari-kathi/charts/open-serve
  ref:
    # Track released charts by semver range so new releases roll out
    # automatically. Pin an exact version instead (tag: 0.2.0) for
    # environments where upgrades must be explicit — recommended for prod.
    semver: ">=0.2.0 <1.0.0"
