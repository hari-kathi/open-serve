# Flux Kustomizations for one cluster. `flux bootstrap` generates
# flux-system/ (gotk-components.yaml + gotk-sync.yaml) next to this file;
# the GitRepository named flux-system below is created by that bootstrap.
#
# dependsOn DAG:
#
#   configs ──┬─▶ kuberay-operator ──────────┬─▶ open-serve
#             └─▶ prometheus-operator-crds ─▶ monitoring ─┘
#
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/flux/environments/example/configs
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kuberay-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/flux/environments/example/kuberay-operator
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/flux/environments/example/prometheus-operator-crds
  # CRDs are never pruned automatically — deleting them cascades to every
  # PodMonitor/PrometheusRule in the cluster.
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/flux/environments/example/monitoring
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-serve
  namespace: flux-system
spec:
  dependsOn:
    - name: kuberay-operator
    - name: monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/flux/environments/example/open-serve
  prune: true
  wait: true
