apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/monitoring
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: kube-prometheus-stack-values
    namespace: open-serve
    files:
      - values.yaml=values.yaml
patches:
  - path: release.yaml
    target:
      kind: HelmRelease
